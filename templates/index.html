<!DOCTYPE html>
<html>
<head>
    <title>악기 추천 챗봇</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .chat-container {
            margin-top: 20px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .input-container {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        #userInput {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .send-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .send-btn:hover {
            background-color: #0056b3;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            max-width: 80%;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            margin-left: auto;
        }
        .bot-message {
            background-color: #f0f0f0;
        }
        .product-card {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .product-image {
            max-width: 200px;
            height: auto;
            display: block;
            margin: 10px 0;
        }
        .loading {
            text-align: center;
            margin: 10px 0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>악기 추천 챗봇</h1>
        <p>원하시는 악기와 예산을 자유롭게 말씀해주세요.</p>
        <p>예시: "50만원 정도 예산으로 초보자용 어쿠스틱 기타를 추천해주세요."</p>
        
        <div class="chat-container" id="chatContainer">
            <div class="message bot-message">
                안녕하세요! 어떤 악기를 찾으시나요? 예산과 함께 말씀해주시면 제가 추천해드리겠습니다.
            </div>
        </div>
        
        <div class="input-container">
            <input type="text" id="userInput" 
                   placeholder="악기와 예산을 자유롭게 입력해주세요."
                   onkeypress="if(event.keyCode==13) sendMessage()">
            <button class="send-btn" onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        function addMessage(message, isUser = false) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            messageDiv.textContent = message;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addProductCard(product) {
            const chatContainer = document.getElementById('chatContainer');
            const cardDiv = document.createElement('div');
            cardDiv.className = 'product-card';
            
            if (product.image) {
                const img = document.createElement('img');
                img.src = product.image;
                img.className = 'product-image';
                cardDiv.appendChild(img);
            }
            
            const content = document.createElement('div');
            content.innerHTML = `
                <h3>${product.name}</h3>
                ${product.price ? `<p>가격: ${product.price}원</p>` : ''}
                ${product.mall ? `<p>판매처: ${product.mall}</p>` : ''}
                ${product.link ? `<p><a href="${product.link}" target="_blank">구매링크</a></p>` : ''}
            `;
            cardDiv.appendChild(content);
            chatContainer.appendChild(cardDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 사용자 메시지 표시
            addMessage(message, true);
            input.value = '';

            // 로딩 메시지 추가
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.textContent = '추천 악기를 찾고 있습니다...';
            document.getElementById('chatContainer').appendChild(loadingDiv);

            try {
                const response = await fetch('/ins/recommend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();
                
                // 로딩 메시지 제거
                loadingDiv.remove();

                if (data.error) {
                    addMessage('죄송합니다. 오류가 발생했습니다: ' + data.error);
                    return;
                }

                // 추천 결과 표시
                addMessage(data.recommendations);
                
                // 제품 카드 표시
                if (data.models && data.models.length > 0) {
                    data.models.forEach(model => addProductCard(model));
                }

            } catch (error) {
                loadingDiv.remove();
                addMessage('죄송합니다. 오류가 발생했습니다. 다시 시도해주세요.');
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
